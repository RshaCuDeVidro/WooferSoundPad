<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WooferSoundPad Overlay</title>
<style>
  /* OBS Browser Source: transparent page, one row per sound playing.
     Options in the URL: &align=right, &scale=1.5, &label=0 (hide the ON AIR tag) */
  :root { --text: #edeae3; --faint: #9e9a92; --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; }
  html, body { margin: 0; background: transparent; overflow: hidden; }
  #list { display: flex; flex-direction: column; gap: 6px; padding: 12px; transform-origin: top left; }
  body.right #list { align-items: flex-end; transform-origin: top right; }
  .row { display: flex; flex-direction: column; gap: 4px; min-width: 240px; max-width: 420px; padding: 8px 12px 6px;
    background: #121212e6; border: 1px solid #2b2b2b; border-left: 3px solid var(--c); border-radius: 5px;
    font: 600 15px var(--mono); color: var(--text); animation: in .18s ease-out; }
  .line { display: flex; gap: 10px; align-items: center; }
  .tag { font-size: 10px; color: var(--c); border: 1px solid var(--c); border-radius: 2px; padding: 1px 4px; }
  .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .left { font-size: 12px; color: var(--faint); font-weight: 500; }
  .track { height: 3px; background: #ffffff14; border-radius: 1px; overflow: hidden; }
  .fill { height: 100%; background: var(--c); width: 0; }
  @keyframes in { from { opacity: 0; transform: translateY(4px); } }
</style>
</head>
<body>
<div id="list"></div>
<script>
  const q = new URLSearchParams(location.search);
  const key = q.get("key") || "";
  if (q.get("align") === "right") document.body.classList.add("right");
  const scale = parseFloat(q.get("scale") || "1");
  document.getElementById("list").style.transform = `scale(${scale})`;
  const showTag = q.get("label") !== "0";
  const fmt = s => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
  const rows = new Map();

  function render(playing) {
    const list = document.getElementById("list");
    const seen = new Set();
    for (const p of playing) {
      const id = String(p.uid);
      seen.add(id);
      let el = rows.get(id);
      if (!el) {
        el = document.createElement("div");
        el.className = "row";
        el.innerHTML = `<div class="line">${showTag ? '<span class="tag">ON AIR</span>' : ""}<span class="name"></span><span class="left"></span></div><div class="track"><div class="fill"></div></div>`;
        list.appendChild(el);
        rows.set(id, el);
      }
      el.style.setProperty("--c", p.color);
      el.querySelector(".name").textContent = p.name;
      el.querySelector(".left").textContent = p.paused ? "PAUSE" : p.loop ? "LOOP" : fmt(p.left);
      el.querySelector(".fill").style.width = (p.progress * 100).toFixed(1) + "%";
    }
    for (const [id, el] of rows) if (!seen.has(id)) { el.remove(); rows.delete(id); }
  }

  async function poll() {
    try {
      const r = await fetch(`/api/state?key=${encodeURIComponent(key)}`);
      if (r.ok) render((await r.json()).playing || []);
    } catch (e) { render([]); }
    setTimeout(poll, 150);
  }
  poll();
</script>
</body>
</html>
